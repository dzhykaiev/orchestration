name: Contracts Gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  boundaries-and-contracts:
    if: ${{ vars.ENABLE_CONTRACT_GATES != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run boundary + contract checks
        run: pnpm run test:contracts
